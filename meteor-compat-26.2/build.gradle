plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'; id 'org.jetbrains.kotlin.jvm' version '2.4.0' }
version = '1.0.0-compat26.2'
group = 'meteordevelopment'
base { archivesName = 'meteor-compat' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
}
dependencies {
    // MC 26.1+ is unobfuscated: non-remapping Loom, no mappings line.
    minecraft "com.mojang:minecraft:26.2"
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "meteordevelopment:orbit:0.2.4"
    include "meteordevelopment:orbit:0.2.4"
    implementation "io.github.llamalad7:mixinextras-fabric:0.5.4"
    implementation "it.unimi.dsi:fastutil:8.5.15"
    implementation "org.jetbrains:annotations:26.0.2"
    include "com.google.code.findbugs:jsr305:3.0.2"
    implementation "org.meteordev:starscript:0.2.5"
    include "org.meteordev:starscript:0.2.5"
    implementation "de.florianreuth:waybackauthlib:1.1.0"
    include "de.florianreuth:waybackauthlib:1.1.0"
    implementation "net.raphimc:MinecraftAuth:5.0.2"
    include "net.raphimc:MinecraftAuth:5.0.2"
    implementation "org.reflections:reflections:0.10.2"
    include "org.reflections:reflections:0.10.2"
    // Loom 1.17 `include` does not pull transitives: javassist (needed by
    // reflections' classpath scanning at startup) must be nested explicitly.
    implementation "org.javassist:javassist:3.28.0-GA"
    include "org.javassist:javassist:3.28.0-GA"
    implementation "io.netty:netty-handler-proxy:4.2.15.Final"
    include "io.netty:netty-handler-proxy:4.2.15.Final"
    implementation "io.netty:netty-codec-socks:4.2.15.Final"
    include "io.netty:netty-codec-socks:4.2.15.Final"
    // Kotlin runtime provided by fabric-language-kotlin at runtime, never bundled.
    implementation "net.fabricmc:fabric-language-kotlin:1.13.12+kotlin.2.4.0"
    // Baritone API (compileOnly like upstream): pathing + starscript reference it.
    compileOnly "meteordevelopment:baritone:26.1-SNAPSHOT"
    // Compile against LiquidBounce, but do not bundle it. Plain compileOnly
    // (NOT modCompileOnly): avoids Loom treating it as a nested mod. Drop
    // your LB 1.26.2 jar at libs/liquidbounce-1.26.2.jar. Only stable LB
    // class/method names are referenced, so no remapping is needed.
    compileOnly(files("libs/liquidbounce-1.26.2.jar"))
}
sourceSets {
    main {
        java { srcDirs = ['sources'] }
        resources { srcDirs = ['resources'] }
    }
    // Merged MeteorBridge (Kotlin) lives in its own source set so task order
    // stays acyclic: bridge compiles against main's *output*, main never
    // depends on bridge. Bridge classes are merged into the main jar below.
    bridge {
        kotlin { srcDirs = ['bridgesrc'] }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
jar { from sourceSets.bridge.output }
loom { accessWidenerPath = file("resources/meteor-client.classtweaker") }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs','100000','-Xmaxwarns','0']; options.fork = true; options.forkOptions.memoryMaximumSize = '4g'; options.failOnError = true }
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { kotlinOptions { jvmTarget = '25'; freeCompilerArgs += ['-Xskip-prerelease-check', '-Xskip-metadata-version-check'] } }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
